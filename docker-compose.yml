
services:
  app:
    build: .
    image: clearlegal-ai:latest
    container_name: clearlegal-ai

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - chroma_data:/app/chroma_db
      - uploads_data:/app/uploads

    restart: unless-stopped

volumes:
  chroma_data:
  uploads_data:
